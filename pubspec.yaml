name: path_out
description: "ARROW: THE LAST LANTERN — a story-driven arrow-maze puzzle."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.0
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  uuid: ^4.5.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels.json
    - assets/legacy-chapter-one.json
    - assets/legacy-campaign-v08.json
    - assets/companions/
    - assets/story/
    - assets/audio/
